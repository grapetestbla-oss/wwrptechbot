name: Build TargetVPN APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Адрес бэкенда, например https://vpn.example.com"
        required: true
      version_name:
        description: "Версия приложения"
        required: false
        default: "1.0.0"
  push:
    paths:
      - "targetvpn/android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Собрать APK
        working-directory: targetvpn/android
        run: |
          API_BASE="${{ github.event.inputs.api_base || 'https://example.com' }}"
          gradle wrapper --gradle-version 8.7 >/dev/null 2>&1 || true
          gradle assembleDebug -PapiBase="$API_BASE" --no-daemon

      - name: Переименовать сборки
        working-directory: targetvpn/android
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          for apk in app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=$(basename "$apk" | sed 's/app-\(.*\)-debug.apk/\1/')
            mv "$apk" "targetvpn-${VERSION}-${abi}.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: targetvpn-apk
          path: targetvpn/android/targetvpn-*.apk
          retention-days: 30

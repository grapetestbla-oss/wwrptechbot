name: Build TargetVPN EXE

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Адрес бэкенда, например https://vpn.example.com"
        required: true
      version_name:
        description: "Версия приложения"
        required: false
        default: "1.0.0"
  push:
    paths:
      - "targetvpn/windows/**"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Тесты
        working-directory: targetvpn/windows
        run: go test ./...

      - name: Собрать EXE
        working-directory: targetvpn/windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          API_BASE="${{ github.event.inputs.api_base || 'https://example.com' }}"
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          go build -trimpath \
            -ldflags "-s -w -X main.apiBase=$API_BASE -X main.appVersion=$VERSION" \
            -o "targetvpn-${VERSION}.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: targetvpn-exe
          path: targetvpn/windows/targetvpn-*.exe
          retention-days: 30

# Локальный/серверный запуск основного ВПС одной командой:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000
    env_file: ../.env
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python bot/bot.py
    env_file: ../.env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
